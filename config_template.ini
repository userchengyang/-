; 超星学习通刷课 CLI 配置文件
; 一键启动(交互向导)会自动生成 config.ini, 本模板仅用于手动配置或 Docker 挂载

[common]
; 手机号账号(交互模式可留空, 启动时会提示输入)
username =

; 登录密码(交互模式可留空, 启动时会提示输入)
password =

; 使用cookie登录, true 则忽略账号密码, 直接从 cookies.txt 读取
use_cookies = false

; 要学习的课程ID列表, 逗号隔开(留空: 交互模式由你选择, 命令行模式学习全部)
course_list =

; 视频播放倍速(默认1, 最大2)
speed = 1

; 同时进行的章节数量
jobs = 4

; 遇到关闭任务点时的行为: retry-重试(默认), continue-继续
notopen_action = retry

; 任务失败/未开启章节的重试等待时间, 单位秒(默认1.0)
retry_interval = 1.0

; 是否允许章节检测答错后自动重做(默认false)
; 注意: 仅允许作答一次的课程若开启重做, 重做轮将无法获取题目导致章节处理失败
work_redo_enabled = false

; 章节检测答错后的最大重做次数(默认3)
work_max_retries = 3

[tiku]
; 本版本答题模块仅支持 AI(OpenAI 兼容接口), provider 固定为 AI
provider = AI

; 启动时是否做一次答题AI连通性测试(会消耗少量token)
check_llm_connection = true

; 是否提交答案: true=达到覆盖率即提交, false=只保存不提交
submit = true

; 最低答案覆盖率(0~1), 达到才提交
cover_rate = 0.8

; 连续查询多道题之间的间隔, 单位秒
delay = 1.0

; OpenAI 兼容接口地址, 需要带 /v1, 例如 https://api.deepseek.com/v1
endpoint =

; API Key
key =

; 模型名称, 例如 deepseek-chat
model =

; 两次请求之间的最小间隔, 单位秒
min_interval_seconds = 1

; 可选: 请求代理, 例如 http://127.0.0.1:7890
http_proxy =

; 判断题答案词表(逗号分隔, 不要带空格)
true_list = 正确,对,√,是
false_list = 错误,错,×,否,不对,不正确
